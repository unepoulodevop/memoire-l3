# Valeurs par défaut du chart MySQL.
# Elles peuvent être surchargées à l'installation (--set ou -f autre-fichier.yaml).

image:
  repository: mysql
  # Version figée (reproductibilité) : branche LTS 8.4, la 8.0 étant en fin de vie depuis avril 2026
  tag: "8.4.11"
  pullPolicy: IfNotPresent

database:
  name: ecommerce
  user: ecommerce

# Nom du Secret Kubernetes contenant les mots de passe.
# Il est créé hors Git : aucun mot de passe n'est jamais versionné.
secretName: mysql-credentials

storage:
  storageClass: local-path
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

# Paramètres MySQL adaptés à des VM de 2 Go de RAM
mysqlConfig:
  innodbBufferPoolSize: 128M
  maxConnections: 50
  # Durée de conservation des journaux binaires : 7 jours
  binlogExpireLogsSeconds: 604800