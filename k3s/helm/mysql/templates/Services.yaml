# Deux Services : des adresses réseau stables à l'intérieur du cluster.
# L'application ne connaît que ces noms (mysql-primary / mysql-replica),
# jamais l'IP d'un pod, qui change à chaque redémarrage.
apiVersion: v1
kind: Service
metadata:
  name: mysql-primary
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: primary
spec:
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: primary
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replica
spec:
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replica
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306