# Valeurs par défaut du chart de l'application.
# Elles peuvent être surchargées à l'installation (--set ou -f autre-fichier.yaml).

# Nombre de copies de l'application (pods) qui tournent en parallèle
replicaCount: 2

image:
  repository: unepoulodevop/memoire-l3-app
  tag: "1.0"
  pullPolicy: IfNotPresent

# Connexion à la base de données (le Service du primary créé par le chart MySQL)
database:
  host: mysql-primary
  port: "3306"
  name: ecommerce
  user: ecommerce

# Secret qui contient le mot de passe de l'application (créé avec le chart MySQL)
secret:
  name: mysql-credentials
  key: MYSQL_APP_PASSWORD

# Exposition : NodePort = l'application répond sur le port 30080 de chaque nœud
service:
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi