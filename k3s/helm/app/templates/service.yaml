# Service : point d'entrée unique qui répartit les requêtes entre les pods
# prêts de l'application. Type NodePort : accessible depuis le poste de
# travail sur http://<IP d'un nœud>:30080
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-app
  labels:
    app.kubernetes.io/name: ecommerce-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ecommerce-app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}