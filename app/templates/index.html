<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogue — E-Commerce Résilient</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --success: #059669;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 32px 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 6px 0 0; opacity: 0.9; font-size: 0.95rem; }
        main {
            max-width: 800px;
            margin: -24px auto 40px;
            padding: 0 20px;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; }
        thead th {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 2px solid var(--border);
        }
        tbody tr { border-bottom: 1px solid var(--border); }
        tbody tr:last-child { border-bottom: none; }
        .price { font-weight: 600; color: var(--success); }
        .stock-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            background: #d1fae5;
            color: #065f46;
        }
        .stock-badge.low { background: #fee2e2; color: #991b1b; }
        form { display: grid; gap: 14px; }
        label { font-size: 0.9rem; font-weight: 500; color: var(--muted); }
        input {
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: var(--primary-dark); }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🛒 Catalogue Produits</h1>
        <p>Démonstrateur — Mémoire L3 : Infrastructure résiliente</p>
    </header>

    <main>
        <div class="card">
            <h2>Produits disponibles</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Produit</th><th>Prix</th><th>Stock</th></tr>
                </thead>
                <tbody>
                    {% for p in products %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td>{{ p.name }}</td>
                        <td class="price">{{ "%.2f"|format(p.price) }} €</td>
                        <td>
                            <span class="stock-badge {% if p.stock < 5 %}low{% endif %}">
                                {{ p.stock }} en stock
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Passer une commande</h2>
            <form action="/order" method="post">
                <div>
                    <label for="product_id">ID du produit</label>
                    <input type="number" id="product_id" name="product_id" required>
                </div>
                <div>
                    <label for="customer_name">Nom du client</label>
                    <input type="text" id="customer_name" name="customer_name" required>
                </div>
                <div>
                    <label for="quantity">Quantité</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1" required>
                </div>
                <button type="submit">Confirmer la commande</button>
            </form>
        </div>
    </main>

    <footer>
        ISI Keur Massar — Réseaux Informatiques L3
    </footer>
</body>
</html>
