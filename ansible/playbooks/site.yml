---
- name: Configuration commune à tous les nœuds du cluster
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Installation et configuration du nœud maître K3s
  hosts: k3s_master
  become: true
  roles:
    - k3s-server

- name: Installation et configuration des nœuds workers K3s
  hosts: k3s_workers
  become: true
  roles:
    - k3s-agent