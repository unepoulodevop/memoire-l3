[k3s_master]
k3s-master ansible_host=127.0.0.1 ansible_port=2222

[k3s_workers]
k3s-worker-1 ansible_host=127.0.0.1 ansible_port=2200
k3s-worker-2 ansible_host=127.0.0.1 ansible_port=2201

[k3s_cluster:children]
k3s_master
k3s_workers

[k3s_cluster:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=.vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key
ansible_python_interpreter=/usr/bin/python3