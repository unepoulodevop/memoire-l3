---
- name: Mettre à jour le cache des paquets APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - curl
      - git
      - vim
      - htop
      - python3
      - apt-transport-https
      - ca-certificates
    state: present

- name: Désactiver le swap (requis par Kubernetes/K3s)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Supprimer toute entrée swap dans /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Déclarer tous les nœuds du cluster dans /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
